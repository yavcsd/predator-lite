[package]
name = "predator-lite"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Tiny PredatorSense replacement for Acer Predator laptops: fans, fan curves, Turbo/Balanced/Eco, GPU, keyboard lighting (BIOS WMI)"
authors = ["yavcsd"]
license = "MIT"
repository = "https://github.com/yavcsd/predator-lite"
readme = "README.md"
keywords = ["acer", "predator", "fan-control", "predatorsense", "windows"]
categories = ["hardware-support", "command-line-utilities"]
build = "build.rs"

[[bin]]
name = "predator-lite"
path = "src/main.rs"
# The binary requires elevation (manifest); tests live in the library.
test = false

# The same groups as `cargo clippy -- -W clippy::perf -W clippy::pedantic -W clippy::style
# -W clippy::complexity`, with no lint allowed crate-wide. The few intended lossy casts are in
# small helpers with a local `#[allow]` that gives the reason.
[lints.clippy]
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
